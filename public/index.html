

<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>NERVLite</title>
		<meta name="theme-color" content="#0a0a0b" />
		<link rel="shortcut icon" content="favicon.ico" />
		<link rel="stylesheet" href="index.css" />

		<script src="baremux/index.js"></script>
		<script src="uv/uv.bundle.js"></script>
		<script src="uv/uv.config.js"></script>
	<base target="_blank">
</head>

	<body>
		<div class="bg"></div>
		<div class="veil"></div>

		<main>
			<div class="hero">
				<h1 class="wordmark">NERV<em>LITE</em></h1>

				<form id="uv-form">
					<input
						id="uv-search-engine"
						value="https://www.google.com/search?q=%s"
						type="hidden"
					/>
					<div class="field">
						<input id="uv-address" type="text" placeholder="URL または検索ワードを入力" spellcheck="false" />
					</div>
				</form>

				<p id="uv-error"></p>
				<pre id="uv-error-code"></pre>
				<button id="uv-register-sw" value="Register service worker">
					Register service worker
				</button>
			</div>
		</main>

		<footer>
			<p class="credit">CREATED BY <b>revZ</b></p>
		</footer>

		<iframe style="display:none" id="uv-frame"></iframe>
		<script src="register-sw.js"></script>
		<script src="search.js"></script>
		<script src="index.js"></script>
	</body>
</html>
